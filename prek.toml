[[repos]]
repo = "builtin"
hooks = [
  { id = "end-of-file-fixer" },
  { id = "trailing-whitespace" },
]

[[repos]]
repo = "local"
hooks = [
  { id = "validate-public-notes", name = "validate public notes", language = "system", entry = "uv run python scripts/validate_public_notes.py", always_run = true, pass_filenames = false },
]

[[repos]]
repo = "https://github.com/pre-commit/mirrors-prettier"
rev = "v4.0.0-alpha.8"
hooks = [
  { id = "prettier", types_or = ["markdown", "yaml", "json"] },
]
