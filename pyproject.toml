[project]
name = "kb"
version = "0.1.0"
description = "Pure-markdown knowledge base with semantic organization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
embeddings = [
    "openai>=1.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[dependency-groups]
dev = [
    "prek>=0.3.5",
]
